# Lint + format Python des modules Odoo (SoT — miroir vers erlesolutions/odoo-quality-ci).
# ruff couvre le Python GÉNÉRAL (style, imports, pyupgrade, bugbear) ; les checks SPÉCIFIQUES
# Odoo (manifeste, xml_id, traductions, ORM) sont à pylint-odoo (.pylintrc). Version : ruff 0.15.20
# — à garder synchro avec deploy/cellule.Dockerfile et .pre-commit-config.yaml.
target-version = "py312"        # image Odoo 19 = Python 3.12
line-length = 88                # standard OCA (compatible ruff-format)

[lint]
select = ["E", "F", "I", "UP", "B", "C4", "W", "RUF"]
ignore = [
    "E501",     # ligne trop longue — le formateur gère l'essentiel (URLs/chaînes exclues)
    "B008",     # appel dans un défaut d'argument — fréquent et idiomatique côté Odoo (fields.Xxx(...))
]

[lint.per-file-ignores]
"__init__.py" = ["F401"]        # ré-exports de modèles/contrôleurs
"__manifest__.py" = ["B018"]    # le manifeste = un dict littéral en expression de module

# Ticket #3 — imports en 4 paragraphes officiels Odoo : stdlib / externe / `odoo` / `odoo.addons`.
# Sans ça, `odoo` et `odoo.addons` tombent dans le même bloc « tierce partie ». `I` (isort) les impose.
[lint.isort]
section-order = ["future", "standard-library", "third-party", "odoo", "odoo-addons", "first-party", "local-folder"]

[lint.isort.sections]
"odoo" = ["odoo"]                # framework : from odoo import ...
"odoo-addons" = ["odoo.addons"]  # autres modules : from odoo.addons.x import ... (préfixe + spécifique)
